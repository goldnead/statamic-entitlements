<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#1E40AF"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#172554" flood-opacity="0.32"/>
    </filter>
  </defs>

  <!-- rounded square background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- a key: the one glyph in the suite that says "may you" rather than
       "what happened". Suppression's shield is the gate for mail, this is the
       gate for everything else. -->
  <g transform="rotate(-40 256 256)">
    <g filter="url(#sh)">
      <circle cx="256" cy="170" r="76" fill="#FFFFFF"/>
      <rect x="234" y="230" width="44" height="190" rx="22" fill="#FFFFFF"/>
      <rect x="278" y="326" width="48" height="34" rx="12" fill="#FFFFFF"/>
      <rect x="278" y="382" width="34" height="30" rx="12" fill="#FFFFFF"/>
    </g>
    <circle cx="256" cy="170" r="32" fill="url(#bg)"/>
  </g>
</svg>
